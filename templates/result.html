<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/static/img/favicon.ico">
  <link rel="apple-touch-icon-precomposed" href="/static/img/favicon.ico" />
  <title>2026 김예진 퀴즈</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/base2.css') }}" />
  <style>
    .result-container { max-width: 480px; margin: 60px auto; padding: 30px 20px; text-align: center; }
    .score-badge { font-size: 3rem; font-weight: 800; color: #4a90e2; margin: 15px 0; }
    .form-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .btn-home-go { width: 100%; padding: 14px; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; width: 100%; display: block; box-sizing: border-box; }
    .btn-home-go:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="card result-container">
  <h2>🎉 퀴즈가 끝났습니다!</h2>
  <p style="color: #666; margin-top: 5px;">고생하셨습니다. 과연 나의 점수는?</p>

  <div class="score-badge">{{ score }}점</div>
  <p style="font-size: 1.05rem;"> 20 문제 중 <strong>{{ count }}문제</strong>를 맞추셨습니다!</p>

  <div class="prize-display-box">
    상품 : <span id="display-prize-name">상품 로딩 중...</span>
  </div>

  <script src="{{ url_for('static', filename='js/prize_manager.js') }}"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 백엔드 세션에서 넘어온 실시간 점수 변수 바인딩
      const userScore = parseInt("{{ score }}", 10);
      document.getElementById("display-prize-name").innerText = PrizeManager.getPrizeName(userScore);
    });
  </script>

  <hr style="border: 0; height: 1px; background: #eee; margin: 25px 0;">

  {% if attempt_count < 3 %}
  <div style="background-color: #fafafa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eaeaea;">
    <p style="font-size: 0.9rem; color: #333; font-weight: bold; text-align: left;">
      이 점수로 이벤트 응모하기
    </p>
    <form action="/submit-contact" method="POST">
      <input type="text" name="contact_info" placeholder="인스타 ID 또는 핸드폰 번호" required class="form-input" style="margin-bottom: 10px;" value="{{ user.contact_info if user.contact_info else '' }}">
      <button type="submit" class="btn-home-go" style="background-color: #2e7d32;"> 제출하고 홈으로 가기</button>
    </form>
  </div>

  <div style="margin-top: 20px;">
    <p style="font-size: 0.85rem; color: #666; margin-bottom: 8px;"> 점수가 아쉬운가요? (현재 도전 횟수: {{ attempt_count }} / 3회)</p>
    <a href="/quiz/start" class="btn-home-go" style="background-color: #7f8c8d; text-decoration: none;">
     다시 도전하기
    </a>
  </div>
  {% else %}
  <div style="background-color: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #856404; font-size: 0.85rem; border: 1px solid #ffeeba; text-align: left;">
    <strong> 모든 도전 기회를 사용하셨습니다!</strong><br>
    이제 아래 창에 최종 정보를 기입하셔야 완료됩니다. <br> (3번 중 최고 점수로 제출됩니다.)
  </div>

  <form action="/submit-contact" method="POST">
    <input type="text" name="contact_info" placeholder="인스타 ID 또는 핸드폰 번호" required class="form-input" value="{{ user.contact_info if user.contact_info else '' }}">
    <button type="submit" class="btn-home-go" style="background-color: #4a90e2;"> 🎯 이벤트 참여 완료하기</button>
  </form>
  {% endif %}
</div>

<a href="/" class="btn-home-go">홈으로 돌아가기</a>

</body>
</html>
