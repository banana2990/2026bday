<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>정답 확인하기</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base2.css') }}" />
  <style>
    .review-container { max-width: 500px; margin: 40px auto; padding: 20px; }
    .question-item { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
    .option-box { display: block; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 6px; }

    /* 정답/오답 스타일 */
    .olive-bg { background-color: #6B8E23 !important; color: white; border-color: #6B8E23 !important; }
    .red-bg { background-color: #ffebee !important; color: #c62828; border-color: #ffcdd2 !important; }
  </style>
</head>
<body>
<div class="card review-container">
  <h2>📋 정답 확인</h2>
  <p>최고 점수를 받은 기록입니다.</p>

  <script src="{{ url_for('static', filename='js/quiz_data.js') }}"></script>
  <div id="review-list"></div>

  <a href="/" class="btn-home-go" style="background-color: #333; margin-top:20px; text-decoration:none;">홈으로 돌아가기</a>
</div>

<script>
  const userAnswers = JSON.parse('{{ best_attempt.selected_answers | safe }}');
  const container = document.getElementById('review-list');

  quizData.forEach((q, i) => {
    const userSelected = userAnswers[i];
    const correctIdx = q.answer; // 정답 인덱스
    const item = document.createElement('div');
    item.className = 'question-item';

    let optionsHtml = '';
    q.options.forEach((opt, optIdx) => {
      // 1. 기본 스타일
      let className = 'option-box';

      // 2. 정답인 경우: 무조건 올리브색 (정답 위치 표시)
      if (optIdx === correctIdx) {
        className += ' olive-bg';
      }
      // 3. 내가 고른 게 틀린 경우: 그 선택지에만 빨간색 추가
      else if (optIdx === userSelected) {
        className += ' red-bg';
      }

      optionsHtml += `<div class="${className}">${optIdx + 1}. ${opt}</div>`;
    });

    // 결과 메시지
    const isCorrect = (userSelected === correctIdx);
    const resultMsg = isCorrect
            ? `<p style="color: #6B8E23; font-weight: bold; margin-top:10px;">✅ 정답입니다!</p>`
            : `<p style="color: #c62828; font-weight: bold; margin-top:10px;">❌ 오답입니다.</p>`;

    item.innerHTML = `<p><strong>${q.id}. ${q.question}</strong></p>${optionsHtml}${resultMsg}`;
    container.appendChild(item);
  });
</script>

</body>
</html>
